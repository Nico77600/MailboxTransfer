name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.engine }})
    runs-on: windows-2022
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include: [{"engine":"PowerShell 7","shell":"pwsh","package":true,"pwsh":"7.5","pwshVersion":"7.5.13","exact":false}]
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Ensure PowerShell 7.5 or later (the engine requires it; the image ships 7.4)
        shell: pwsh
        run: .\.github\scripts\Install-PowerShell.ps1 -Version '${{ matrix.pwshVersion }}' -Exact:$${{ matrix.exact }}

      - name: Show the PowerShell that runs the next steps
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          $PSHOME
          if ($PSVersionTable.PSVersion -lt [version]'7.5.0') { throw 'PowerShell 7.5+ is required.' }
          if ([bool]::Parse('${{ matrix.exact }}') -and $PSVersionTable.PSVersion.ToString() -ne '${{ matrix.pwshVersion }}') { throw 'PowerShell ${{ matrix.pwshVersion }} is required for this leg.' }

      - name: Load pinned analysis and test modules
        shell: pwsh
        run: .\.github\scripts\Initialize-CIModules.ps1 -Destination "$env:RUNNER_TEMP\ci-modules"

      - name: Analyze PowerShell sources (PowerShell ${{ matrix.pwsh }})
        shell: pwsh
        run: .\.github\scripts\Invoke-CI.ps1 -Stage Analyze -OutputDirectory "$env:RUNNER_TEMP\ci-results"

      - name: Run the existing project tests (PowerShell ${{ matrix.pwsh }})
        shell: pwsh
        run: .\.github\scripts\Invoke-CI.ps1 -Stage Test -OutputDirectory "$env:RUNNER_TEMP\ci-results"

      - name: Build with the existing package tool (PowerShell ${{ matrix.pwsh }})
        shell: pwsh
        run: .\.github\scripts\Invoke-CI.ps1 -Stage Package -OutputDirectory "$env:RUNNER_TEMP\ci-results"

      - name: Add PowerShell 7.6.10 for the console checks
        shell: pwsh
        run: .\.github\scripts\Install-PowerShell.ps1 -Version '7.6.10' -Exact

      - name: Run the console tests (PowerShell 7.6)
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.ToString() -ne '7.6.10') { throw 'PowerShell 7.6.10 is required for this step.' }
          $env:PSModulePath = $env:CI_MODULE_PATH + [IO.Path]::PathSeparator + $env:PSModulePath
          Import-Module Pester -RequiredVersion 6.1.0 -Force -ErrorAction Stop
          $out = Join-Path $env:RUNNER_TEMP 'ci-results\powershell-7.6'
          $null = New-Item -ItemType Directory -Force -Path $out
          $pester = New-PesterConfiguration
          $pester.Run.Path = @('tests/Gui.Smoke.Tests.ps1', 'tests/Gui.ClickThrough.Tests.ps1', 'tests/Gui.CommandLine.Tests.ps1')
          $pester.Run.PassThru = $true
          $pester.Output.Verbosity = 'Normal'
          $pester.TestResult.Enabled = $true
          $pester.TestResult.OutputFormat = 'NUnitXml'
          $pester.TestResult.OutputPath = Join-Path $out 'pester-results.xml'
          $result = Invoke-Pester -Configuration $pester
          if ($null -eq $result -or $result.PassedCount -le 0 -or $result.FailedCount -gt 0 -or $result.FailedContainersCount -gt 0 -or [string]$result.Result -ne 'Passed') {
            throw 'The console tests did not pass on PowerShell 7.6.'
          }

      - name: Retain public CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-powershell-${{ matrix.pwsh }}
          path: |
            ${{ runner.temp }}/ci-results
            tests/evidence/gate
          if-no-files-found: error
          retention-days: 7
