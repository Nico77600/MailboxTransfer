<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="490" viewBox="0 0 1600 490" role="img" aria-labelledby="title desc">
  <title id="title">Mailbox Transfer</title>
  <desc id="desc">Exchange Online mailbox export and import to a verified store or to PST files, with a guided Windows console and PST check and repair.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#262626"/><stop offset="1" stop-color="#46353b"/>
    </linearGradient>
    <clipPath id="card"><rect x="10" y="10" width="1580" height="470" rx="26"/></clipPath>
  </defs>
  <rect x="10" y="10" width="1580" height="470" rx="26" fill="url(#surface)" stroke="#535353" stroke-width="2"/>
  <g clip-path="url(#card)"><circle cx="1430" cy="40" r="235" fill="none" stroke="#ff89a5" stroke-opacity=".1" stroke-width="70"/></g>
  <path d="M37 13H1563" stroke="#ff89a5" stroke-width="5" stroke-linecap="round"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="55" y="55" width="88" height="88" rx="24" fill="#ff89a5"/>
    <g fill="none" stroke="#242424" stroke-width="3.5" stroke-linejoin="round"><rect x="76" y="82" width="46" height="34" rx="5"/><path d="M79 88l20 15 20-15"/></g>
    <text x="170" y="77" fill="#ff89a5" font-size="16" font-weight="700" letter-spacing="2">EXCHANGE ONLINE / MAILBOXES AND PST FILES</text>
    <text x="170" y="126" fill="#f5f5f5" font-size="43" font-weight="700">Mailbox Transfer</text>
    <text x="55" y="205" fill="#f5f5f5" font-size="27">Export and import Exchange Online mailboxes.</text>
    <text x="55" y="252" fill="#d1d1d1" font-size="23">Verified and resumable, with a guided Windows console.</text>
    <text x="55" y="286" fill="#d1d1d1" font-size="23">Checks and repairs PST files, without Outlook.</text>
    <rect x="55" y="335" width="212" height="48" rx="24" fill="#ff89a5"/>
    <text x="161" y="365" text-anchor="middle" fill="#242424" font-size="19" font-weight="600">1.1.0 release</text>
    <rect x="280" y="335" width="195" height="48" rx="24" fill="#262626" stroke="#535353"/>
    <text x="378" y="365" text-anchor="middle" fill="#d1d1d1" font-size="19">PowerShell 7.5+</text>
    <rect x="488" y="335" width="227" height="48" rx="24" fill="#262626" stroke="#535353"/>
    <text x="602" y="365" text-anchor="middle" fill="#d1d1d1" font-size="19">No Outlook needed</text>
    <text x="55" y="435" fill="#d1d1d1" font-size="17">Nicolas Fabert / MIT license</text>
    <g fill="#262626" stroke="#535353" stroke-width="2">
      <rect x="1080" y="75" width="455" height="100" rx="22"/>
      <rect x="1080" y="195" width="455" height="100" rx="22"/>
      <rect x="1080" y="315" width="455" height="100" rx="22"/>
    </g>
    <g fill="#ff89a5" font-weight="700" font-size="32"><text x="1110" y="136">4</text><text x="1110" y="256">50</text><text x="1110" y="376">0</text></g>
    <g fill="#f5f5f5" font-size="21" font-weight="600"><text x="1200" y="119">Tasks in one console</text><text x="1200" y="239">GB per PST part</text><text x="1200" y="359">Items deleted</text></g>
    <g fill="#d1d1d1" font-size="19"><text x="1200" y="150">Export, import, check PST, open</text><text x="1200" y="270">Each part checked when written</text><text x="1200" y="390">Import adds, export only reads</text></g>
  </g>
</svg>
